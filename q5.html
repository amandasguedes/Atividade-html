<!DOCTYPE html>
<html lang="pt">
<head>

<body>
    <script>
        const km=Number(prompt("digite a distância:"));
    const litros=Number(prompt("digite o combustível gasto:"));
    const media=km/litros;
    alert("a média de consumo é de: "+media.tofixed(2)+" km/l");
    </script>
</body>
