<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    const total=Number(prompt("digite a quantidade de dias que o usuario viveu:"));
    const anos=Math.floor(total/365);
    const meses=Math.floor((total%365)/30);
    const dias=(total%365)%30;
    alert(`${anos} anos, ${meses} meses e ${dias} dias.`);
    </script>
</body>
</html>
