<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    const total=Number(prompt("digite o valor total do produto:"));
    const pago=Number(prompt("digite o valor com desconto:"));
    const desconto=((total-pago)/total)*100;
    alert("a porcentagem de desconto aplicada foi:"+desconto.tofixed(2)+"%");
    </script>
</body>
</html>
